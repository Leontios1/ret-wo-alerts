name: RET-WO alerts

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 min (GitHub's minimum; runs can be a few minutes late)
  workflow_dispatch:         # lets you run it manually from the Actions tab

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Restore seen-matches state
        uses: actions/cache/restore@v4
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - name: Check for retirements / walkovers / forfeits
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          PANDASCORE_TOKEN:   ${{ secrets.PANDASCORE_TOKEN }}
        run: python alerter.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
